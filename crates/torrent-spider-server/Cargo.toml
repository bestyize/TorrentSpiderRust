[package]
name = "torrent-spider-server"
description = "HTTP API and web page for torrent-spider"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
torrent-spider = { workspace = true, features = ["reqwest"] }
aho-corasick = "1.1.5"
async-trait.workspace = true
axum = "0.8.9"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs"] }
tower-http = { version = "0.7.1", features = ["cors", "compression-gzip", "trace", "set-header", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
torrent-spider = { workspace = true, features = ["testing"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }

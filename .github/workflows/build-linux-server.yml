# 手动构建部署到 Ubuntu 26.04 x86_64 的 torrent-spider-server。
#
# 直接在 ubuntu-26.04 runner 上原生构建：链接的 glibc 与服务器一致，
# 部署测试也跑在与生产相同版本的 systemd 上。
#
# 在 GitHub 的 Actions 页选中本 workflow，点「Run workflow」即可；也可以用命令行：
#   gh workflow run build-linux-server.yml
# 产物在该次运行页面底部的 Artifacts 里；服务器上的部署步骤见 docs/deployment.md。

name: Build Linux server

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 构建前先跑全部测试
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PLATFORM: ubuntu26.04-x86_64

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        if: inputs.run_tests
        run: cargo test --workspace --all-features --locked

      - name: Build
        run: cargo build --release --locked -p torrent-spider-server

      - name: Package
        id: package
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "torrent-spider-server") | .version')
          name="torrent-spider-server-${version}-${PLATFORM}"
          mkdir -p "dist/$name"
          cp target/release/torrent-spider-server "dist/$name/"
          cp deploy/torrent-spider.sh deploy/torrent-spider.service deploy/torrent-spider.env "dist/$name/"
          chmod +x "dist/$name/torrent-spider.sh"
          cp README.md "dist/$name/"
          cp docs/deployment.md "dist/$name/DEPLOY.md"
          cp docs/api.md "dist/$name/API.md"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # 真的把二进制跑起来打一次 /api/health：链接出错、静态资源没嵌进去这类问题只有运行时才暴露。
      # 关掉违禁过滤，免得冒烟测试依赖外网拉 IP 段。
      - name: Smoke test
        run: |
          bin="dist/${{ steps.package.outputs.name }}/torrent-spider-server"
          file "$bin"
          ldd "$bin"
          PORT=55555 HOST=127.0.0.1 SENSITIVE_FILTER=0 "$bin" &
          pid=$!
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:55555/api/health && break
            sleep 1
          done
          echo
          curl -fsS -o /dev/null http://127.0.0.1:55555/index.html
          curl -fsS http://127.0.0.1:55555/api/sources | jq -e '.sources | length == 11' > /dev/null
          kill "$pid"
          wait "$pid"

      - name: Lint deploy script
        run: shellcheck deploy/torrent-spider.sh

      # 在 runner 自带的 systemd 上把发布包真装一遍：安装、升级、坏版本自动回滚、回滚、卸载。
      # 单元文件的沙箱选项（DynamicUser、只读文件系统、缓存目录）只有真的 systemd 才验证得了
      - name: Deploy test (systemd)
        env:
          PKG_NAME: ${{ steps.package.outputs.name }}
        run: |
          set -euo pipefail
          pkg="$PWD/dist/$PKG_NAME.tar.gz"
          health=http://127.0.0.1:55555/api/health
          work=$(mktemp -d)
          tar -C "$work" -xzf "$pkg"
          cd "$work/$PKG_NAME"

          echo "::group::install"
          sudo ./torrent-spider.sh install
          sudo systemd-analyze verify /etc/systemd/system/torrent-spider.service
          torrent-spider status
          curl -fsS "$health" | jq -e '.filter.enabled and .filter.ready' > /dev/null
          # IP 段缓存写进了 systemd 管理的缓存目录，说明沙箱下的写权限配对了
          sudo test -s /var/cache/torrent-spider/china_ip_list.txt
          echo "::endgroup::"

          echo "::group::upgrade"
          sudo torrent-spider upgrade "$pkg"
          sudo test -x /opt/torrent-spider/torrent-spider-server.prev
          echo "::endgroup::"

          echo "::group::broken upgrade rolls back"
          mkdir broken
          printf '#!/bin/sh\n[ "$1" = --version ] && echo "torrent-spider-server 9.9.9-broken" && exit 0\nexit 1\n' \
            > broken/torrent-spider-server
          chmod +x broken/torrent-spider-server
          if sudo torrent-spider upgrade broken/torrent-spider-server; then
            echo "启动就崩的版本居然升级成功了"; exit 1
          fi
          curl -fsS "$health" > /dev/null
          echo "::endgroup::"

          echo "::group::rollback"
          sudo torrent-spider upgrade "$pkg"
          sudo torrent-spider rollback
          sudo torrent-spider rollback
          curl -fsS "$health" > /dev/null
          echo "::endgroup::"

          echo "::group::rapid restarts"
          # 连着重启超过 systemd 的启动频率限制（StartLimitBurst），脚本要能照常启动
          for _ in 1 2 3 4 5 6 7; do sudo torrent-spider restart > /dev/null; done
          curl -fsS "$health" > /dev/null
          echo "::endgroup::"

          echo "::group::stop / start"
          sudo torrent-spider stop
          if curl -fsS "$health" 2> /dev/null; then echo "stop 之后服务还在响应"; exit 1; fi
          sudo torrent-spider start
          # SIGTERM 走的是优雅退出；日志进 journald，不该带颜色控制符
          sudo journalctl -u torrent-spider -o cat --no-pager | grep -q "收到退出信号"
          if sudo journalctl -u torrent-spider -o cat --no-pager | grep -q $'\x1b\['; then
            echo "journald 里出现了 ANSI 颜色控制符"; exit 1
          fi
          echo "::endgroup::"

          echo "::group::uninstall"
          sudo torrent-spider uninstall --purge
          for path in /opt/torrent-spider /etc/torrent-spider /etc/systemd/system/torrent-spider.service \
            /usr/local/bin/torrent-spider /var/cache/torrent-spider; do
            if sudo test -e "$path"; then echo "卸载后还残留 $path"; exit 1; fi
          done
          if curl -fsS "$health" 2> /dev/null; then echo "卸载之后服务还在响应"; exit 1; fi
          echo "::endgroup::"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
